<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aile Günlüğü</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Nunito:wght@400;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap');
:root{--paper:#F1F4EC;--paper-card:#FFF;--ink:#2E3B2C;--ink-soft:rgba(46,59,44,.55);--plum:#6B4A63;--gold:#C9A227;--gold-soft:#F2E7C4;--sage:#5C7A52;--sage-soft:#DCE6D4;--coral:#C8695A;--line:rgba(46,59,44,.14)}
*{box-sizing:border-box} body{margin:0;background:var(--paper);font-family:Nunito,sans-serif;color:var(--ink)}
.wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px}.title{font-family:Fraunces,serif;font-weight:600;font-size:1.7rem;color:var(--plum);margin:0 0 4px}.subtitle{font-size:.85rem;color:var(--ink-soft);margin:0 0 22px}
.setup-banner{background:#FCEFEA;border:1px solid var(--coral);color:var(--coral);border-radius:14px;padding:14px 16px;font-size:.82rem;font-weight:700;margin-bottom:20px;line-height:1.5}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:20px}.tab{border:2px solid var(--line);cursor:pointer;padding:12px 4px;border-radius:14px;font-family:Nunito,sans-serif;font-weight:800;font-size:.92rem;background:#fff;color:var(--ink-soft);transition:all .2s}.tab.active{color:#fff;border-color:transparent}
.date-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.date-label{font-family:Fraunces,serif;font-weight:600;font-size:1.15rem;color:var(--ink);text-transform:capitalize;text-align:center}.today-pill{display:inline-block;font-family:'IBM Plex Mono',monospace;font-size:.62rem;letter-spacing:.08em;color:var(--sage);background:rgba(92,122,82,.12);padding:2px 8px;border-radius:20px;margin-top:4px}.nav-btn{width:38px;height:38px;border-radius:50%;border:2px solid var(--line);background:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);font-size:1.1rem}.nav-btn:hover{border-color:var(--plum)}
.sheet{background:var(--paper-card);border-radius:22px;padding:22px 20px;box-shadow:0 14px 40px -22px rgba(46,59,44,.35);border:1px solid var(--line);position:relative}.meal-row{display:grid;grid-template-columns:34px 1fr 92px;gap:10px;align-items:start;padding:14px 0;border-bottom:1px dashed var(--line)}.meal-row:first-child{padding-top:2px}.meal-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1rem}.meal-label{font-size:.72rem;font-weight:700;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;margin-bottom:4px}input[type=text],input[type=time],input[type=number]{width:100%;border:none;border-bottom:2px solid var(--line);background:transparent;font-family:Nunito,sans-serif;font-size:.95rem;color:var(--ink);padding:6px 2px;outline:none}input[type=text]:focus,input[type=time]:focus,input[type=number]:focus{border-color:var(--plum)}input[type=time]{font-family:'IBM Plex Mono',monospace;font-size:.85rem}input::placeholder{color:rgba(46,59,44,.32)}.food-controls{display:flex;gap:6px;margin-top:6px}.food-controls input{width:80px}.food-add{border:0;border-radius:8px;background:var(--sage);color:#fff;padding:0 10px;cursor:pointer;font-weight:800}.food-list{margin-top:7px}.food-chip{display:flex;justify-content:space-between;gap:6px;font-size:.76rem;color:var(--ink-soft);padding:4px 0}.food-chip button{border:0;background:none;color:var(--coral);cursor:pointer}.api-status{font-size:.72rem;color:var(--plum);margin-top:4px;min-height:16px}
.sport-row{display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:16px 0 4px}.save-btn{width:100%;margin-top:18px;border:none;cursor:pointer;padding:14px 0;border-radius:14px;font-family:Nunito,sans-serif;font-weight:800;font-size:1rem;color:#fff}.save-btn:active{transform:scale(.98)}.save-btn:disabled{opacity:.6;cursor:default}.flash{text-align:center;font-size:.85rem;color:var(--sage);font-weight:700;margin-top:10px;min-height:20px}.flash.err{color:var(--coral)}
.day-summary,.history-title{font-family:Fraunces,serif;font-weight:600;font-size:1.05rem;color:var(--plum);margin:28px 0 12px 4px}.day-summary-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;font-size:.86rem}.day-summary-card p{margin:6px 0}.day-summary-card strong{color:var(--ink)}.muted,.hist-empty{font-size:.85rem;color:var(--ink-soft)}
.profile-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:16px}.profile-title{font-family:Fraunces,serif;color:var(--plum);font-size:1rem;margin-bottom:10px}.profile-grid{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:8px}.profile-grid label{font-size:.68rem;color:var(--ink-soft);font-weight:700}.profile-grid input,.profile-grid select{width:100%;border:1px solid var(--line);border-radius:8px;padding:8px 5px;background:#fff;color:var(--ink);font-family:Nunito,sans-serif}.needs{margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:.78rem;color:var(--ink-soft)}.needs strong{color:var(--ink)}
.hist-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer}.hist-date{font-family:'IBM Plex Mono',monospace;font-size:.72rem;color:#fff;padding:6px 8px;border-radius:8px;white-space:nowrap}.hist-summary{flex:1;font-size:.82rem;color:var(--ink-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hist-actions{display:flex;gap:6px;align-items:center}.icon-btn{width:30px;height:30px;border-radius:8px;border:none;background:rgba(46,59,44,.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-soft);font-size:.85rem}.icon-btn.danger{color:var(--coral)}.confirm-row{display:flex;gap:6px;align-items:center;font-size:.75rem;color:var(--coral);font-weight:700;white-space:nowrap}.spinner{position:absolute;top:16px;right:16px;font-size:.7rem;color:var(--ink-soft)}
@media(max-width:430px){.tabs{gap:5px}.tab{font-size:.78rem;padding:11px 2px}.meal-row{grid-template-columns:34px 1fr 82px}}
</style>
</head>
<body>
<div class="wrap">
  <h1 class="title">Aile Günlüğü</h1>
  <p class="subtitle">Yemek saatlerini ve hareketi günlük takip et.</p>
  <div class="setup-banner" id="setup-banner" style="display:none">⚠️ Henüz bir Google E-Tablosu bağlantısı ayarlanmadı.</div>
  <div class="tabs" id="tabs"></div>
  <div class="profile-card"><div class="profile-title">Kişisel Bilgiler — <span id="profile-person"></span></div><div class="profile-grid"><label>Cinsiyet<select id="profile-sex"><option value="female">Kadın</option><option value="male">Erkek</option></select></label><label>Yaş<input id="profile-age" type="number" min="1" max="120" placeholder="Yaş"></label><label>Kilo (kg)<input id="profile-weight" type="number" min="1" placeholder="Kilo"></label><label>Boy (cm)<input id="profile-height" type="number" min="50" placeholder="Boy"></label></div><div class="needs" id="needs"></div></div>
  <div class="date-nav"><button class="nav-btn" id="prev-day">‹</button><div><div class="date-label" id="date-label"></div><div class="today-pill" id="today-pill" style="display:none">BUGÜN</div></div><button class="nav-btn" id="next-day">›</button></div>
  <div class="sheet"><span class="spinner" id="spinner" style="display:none">senkronize ediliyor…</span>
    <div class="meal-row"><div class="meal-icon" id="icon-breakfast">☀️</div><div><div class="meal-label">Kahvaltı</div><input type="text" id="breakfast-desc" placeholder="Örn: 3 yumurta, 100 gram yulaf, 100 ml süt"><div class="food-list" id="breakfast-foods"></div></div><input type="time" id="breakfast-time"></div>
    <div class="meal-row"><div class="meal-icon" id="icon-snack">🍃</div><div><div class="meal-label">Ara Öğün</div><input type="text" id="snack-desc" placeholder="Örn: 1 muz,  ağzına göre badem"><div class="food-list" id="snack-foods"></div></div><input type="time" id="snack-time"></div>
    <div class="meal-row"><div class="meal-icon" id="icon-dinner">🌙</div><div><div class="meal-label">Akşam Yemeği</div><input type="text" id="dinner-desc" placeholder="Örn: 200 gram tavuk, 150 gram pirinç"><div class="food-list" id="dinner-foods"></div></div><input type="time" id="dinner-time"></div>
    <div class="sport-row"><div class="meal-icon" id="icon-sport">🚶</div><div><div class="meal-label">Spor / Hareket</div><input type="text" id="sport-desc" placeholder="Bugün ne yaptı?"></div></div>
    <button class="save-btn" id="save-btn">Kaydet</button><div class="flash" id="flash"></div>
  </div>
  <div class="day-summary">Günün Yemekleri</div><div class="day-summary-card" id="day-summary-card"></div>
  <div class="history-title" id="history-title"></div><div id="history-list"></div>
</div>
<script>
const SCRIPT_URL='https://script.google.com/macros/s/AKfycbwXp2oaILuiVl7dAdpp3QAwRXHOpuxu9RlrPDs07JZsL71e4av1XQcSi1cE50_7wlsKCQ/exec';
const PEOPLE={anne:{label:'İlknur',accent:'#C9A227',accentSoft:'#F2E7C4'},teyze:{label:'Oya',accent:'#5C7A52',accentSoft:'#DCE6D4'},altug:{label:'Altuğ',accent:'#6B4A63',accentSoft:'#E8DCE5'},rana:{label:'Rana',accent:'#C8695A',accentSoft:'#FCEFEA'}};
let personId='anne',dateKey=toDateKey(new Date()),confirmDeleteKey=null,allEntries=[];
let mealFoods={breakfast:[],snack:[],dinner:[]};
let profiles=JSON.parse(localStorage.getItem('aile-gunlugu-profiles')||'{}');
const isConfigured=SCRIPT_URL&&!SCRIPT_URL.includes('PASTE_YOUR');
const $=id=>document.getElementById(id);
function toDateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function normalizeDateKey(value){
  if(value instanceof Date&&!isNaN(value))return toDateKey(value);
  if(typeof value==='number'){const d=new Date(value);if(!isNaN(d))return toDateKey(d)}
  if(!value)return '';
  const s=String(value).trim();
  let m=s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})/);if(m)return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})/);if(m)return `${m[3]}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  const d=new Date(s);return isNaN(d)?'':toDateKey(d);
}
function validDateKey(k){return /^\d{4}-\d{2}-\d{2}$/.test(k)&&!isNaN(new Date(`${k}T00:00:00`))}
function formatTurkishDate(k){const d=new Date(`${normalizeDateKey(k)}T00:00:00`);return isNaN(d)?'Tarih seçilemedi':d.toLocaleDateString('tr-TR',{day:'numeric',month:'long',weekday:'long'})}
function formatTurkishShort(k){const d=new Date(`${normalizeDateKey(k)}T00:00:00`);return isNaN(d)?'—':d.toLocaleDateString('tr-TR',{day:'numeric',month:'short'})}
function emptyForm(){return{breakfast:{desc:'',time:''},snack:{desc:'',time:''},dinner:{desc:'',time:''},sport:''}}
function field(row,...keys){for(const k of keys)if(row[k]!==undefined&&row[k]!==null)return String(row[k]);return ''}
function parseFoods(value){try{const parsed=JSON.parse(value);if(Array.isArray(parsed))return parsed}catch(e){}return value?[{name:value,grams:0,kcal:0,protein:0,carbs:0,fat:0,legacy:true}]:[]}
function foodsToText(items){return JSON.stringify(items)}
function foodText(items){return items.map(x=>x.legacy?x.name:`${x.name} (${x.grams} g)`).join(', ')}
function rowToForm(row){return{breakfast:{foods:parseFoods(field(row,'kahvalti_ne','breakfast_desc')),time:field(row,'kahvalti_saat','breakfast_time')},snack:{foods:parseFoods(field(row,'araogun_ne','snack_desc')),time:field(row,'araogun_saat','snack_time')},dinner:{foods:parseFoods(field(row,'aksam_ne','dinner_desc')),time:field(row,'aksam_saat','dinner_time')},sport:field(row,'spor','sport')}}
function currentForm(){return{breakfast:{foods:mealFoods.breakfast,time:$('breakfast-time').value},snack:{foods:mealFoods.snack,time:$('snack-time').value},dinner:{foods:mealFoods.dinner,time:$('dinner-time').value},sport:$('sport-desc').value}}
function profile(){return profiles[personId]||{sex:'female',age:'',weight:'',height:''}}
function renderNeeds(){const p=profile();$('profile-person').textContent=PEOPLE[personId].label;$('profile-sex').value=p.sex||'female';$('profile-age').value=p.age||'';$('profile-weight').value=p.weight||'';$('profile-height').value=p.height||'';if(!p.age||!p.weight||!p.height){$('needs').innerHTML='<span class="muted">Günlük ihtiyacı görmek için yaş, kilo ve boy bilgilerini girin.</span>';return}const bmr=10*p.weight+6.25*p.height-5*p.age+(p.sex==='male'?5:-161),kcal=Math.round(bmr*1.35),protein=Math.round(p.weight*1.6),fat=Math.round(kcal*.27/9),carbs=Math.round((kcal-protein*4-fat*9)/4),t=totals();$('needs').innerHTML=`<strong>Önerilen günlük ihtiyaç:</strong> ${kcal} kcal · Protein ${protein} g · Karbonhidrat ${carbs} g · Yağ ${fat} g<br><strong>Bugünkü tüketim:</strong> ${Math.round(t.kcal)} kcal · Protein ${Math.round(t.protein)} g · Karbonhidrat ${Math.round(t.carbs)} g · Yağ ${Math.round(t.fat)} g`}
function saveProfile(){profiles[personId]={sex:$('profile-sex').value,age:Number($('profile-age').value)||'',weight:Number($('profile-weight').value)||'',height:Number($('profile-height').value)||''};localStorage.setItem('aile-gunlugu-profiles',JSON.stringify(profiles));renderNeeds()}
function setBusy(v){$('spinner').style.display=v?'inline':'none';$('save-btn').disabled=v}
function showFlash(m,err){$('flash').textContent=m;$('flash').classList.toggle('err',!!err);if(!err)setTimeout(()=>$('flash').textContent='',1800)}
function renderTabs(){const tabs=$('tabs');tabs.innerHTML='';Object.entries(PEOPLE).forEach(([id,p])=>{const b=document.createElement('button');b.className='tab'+(id===personId?' active':'');b.textContent=p.label;b.dataset.person=id;b.style.background=id===personId?p.accent:'#fff';b.style.color=id===personId?'#fff':'var(--ink-soft)';b.onclick=()=>{personId=id;confirmDeleteKey=null;renderHeader();applyDayToForm();renderHistory()};tabs.appendChild(b)})}
function totals(){return Object.values(mealFoods).flat().reduce((a,f)=>{a.kcal+=Number(f.kcal)||0;a.protein+=Number(f.protein)||0;a.carbs+=Number(f.carbs)||0;a.fat+=Number(f.fat)||0;return a},{kcal:0,protein:0,carbs:0,fat:0})}
function renderFoodList(meal){const list=$(`${meal}-foods`);list.innerHTML=mealFoods[meal].map((f,i)=>`<div class="food-chip"><span>${escapeHtml(f.name)} — ${f.grams} g · ${Math.round(f.kcal)} kcal (P ${Math.round(f.protein)}g / K ${Math.round(f.carbs)}g / Y ${Math.round(f.fat)}g)</span><button data-remove-food="${meal}" data-index="${i}">✕</button></div>`).join('');list.querySelectorAll('[data-remove-food]').forEach(b=>b.onclick=()=>{mealFoods[meal].splice(Number(b.dataset.index),1);renderFoodList(meal);renderDaySummary()})}
function renderDaySummary(){Object.keys(mealFoods).forEach(renderFoodList);const t=totals();const has=Object.values(mealFoods).some(x=>x.length)||$('sport-desc').value;const meals=Object.entries(mealFoods).filter(([,x])=>x.length).map(([k,x])=>`<p><strong>${k==='breakfast'?'Kahvaltı':k==='snack'?'Ara Öğün':'Akşam'}:</strong> ${escapeHtml(x.map(f=>f.name).join(', '))}</p>`).join('');$('day-summary-card').innerHTML=has?`${meals}${$('sport-desc').value?`<p><strong>Spor:</strong> ${escapeHtml($('sport-desc').value)}</p>`:''}<hr><p><strong>Toplam:</strong> ${Math.round(t.kcal)} kcal · Protein ${Math.round(t.protein)} g · Karbonhidrat ${Math.round(t.carbs)} g · Yağ ${Math.round(t.fat)} g</p>`:'<span class="muted">Bugün henüz yemek veya hareket girilmedi.</span>'}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function applyDayToForm(){const match=allEntries.find(r=>field(r,'kisi','person')===personId&&normalizeDateKey(field(r,'tarih','date'))===dateKey);const f=match?rowToForm(match):{breakfast:{foods:[],time:''},snack:{foods:[],time:''},dinner:{foods:[],time:''},sport:''};mealFoods={breakfast:f.breakfast.foods||[],snack:f.snack.foods||[],dinner:f.dinner.foods||[]};$('breakfast-desc').value='';$('breakfast-time').value=f.breakfast.time;$('snack-desc').value='';$('snack-time').value=f.snack.time;$('dinner-desc').value='';$('dinner-time').value=f.dinner.time;$('sport-desc').value=f.sport;renderDaySummary();renderNeeds()}
function renderHeader(){const p=PEOPLE[personId];renderTabs();$('date-label').textContent=formatTurkishDate(dateKey);$('today-pill').style.display=dateKey===toDateKey(new Date())?'inline-block':'none';['breakfast','snack','dinner','sport'].forEach(k=>{$(`icon-${k}`).style.background=p.accentSoft;$(`icon-${k}`).style.color=p.accent});$('save-btn').style.background=p.accent;$('history-title').textContent=`Geçmiş Kayıtlar — ${p.label}`;$('setup-banner').style.display=isConfigured?'none':'block'}
async function fetchAllEntries(){if(!isConfigured)return[];const r=await fetch(SCRIPT_URL);if(!r.ok)throw Error('network');const data=await r.json();return Array.isArray(data)?data:[]}
async function refreshAll(){setBusy(true);try{allEntries=await fetchAllEntries();applyDayToForm();renderHistory()}catch(e){showFlash('Veriler alınamadı. Bağlantını kontrol et.',true)}finally{setBusy(false)}}
async function postToScript(payload){await fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)})}
function extractFoods(text){const found=[],rx=/(\d+(?:[.,]\d+)?)\s*(kg|g|gram|gr|ml|l|adet|tane)?\s*([^\d,;]+?)(?=\s+\d+(?:[.,]\d+)?\s*(?:kg|g|gram|gr|ml|l|adet|tane)?\s|[,;]|$)/gi;let m;while((m=rx.exec(text))){let qty=Number(m[1].replace(',','.')),unit=(m[2]||'').toLowerCase(),name=m[3].trim();if(!name)continue;if(unit==='kg'||unit==='l')qty*=1000;if(unit==='adet'||unit==='tane')qty*=50;found.push({name,grams:Math.round(qty)})}return found}
async function lookupFood(item){const url=`https://world.openfoodfacts.org/cgi/search.pl?search_terms=${encodeURIComponent(item.name)}&search_simple=1&action=process&json=1&page_size=8`;const res=await fetch(url);if(!res.ok)throw Error('api');const data=await res.json();const product=(data.products||[]).find(p=>p.nutriments&&p.nutriments['energy-kcal_100g']!==undefined)||data.products?.[0];if(!product)throw Error('not-found');const n=product.nutriments||{},factor=item.grams/100,kcal=Number(n['energy-kcal_100g'])||((Number(n['energy_100g'])||0)/4.184);return{name:product.product_name||item.name,grams:item.grams,kcal:kcal*factor,protein:(Number(n.proteins_100g)||0)*factor,carbs:(Number(n.carbohydrates_100g)||0)*factor,fat:(Number(n.fat_100g)||0)*factor}}
async function resolveMeal(meal){const input=$(`${meal}-desc`),text=input.value.trim();if(!text)return;if(!/\d/.test(text))throw Error('quantity');const parts=extractFoods(text);if(!parts.length)throw Error('quantity');const results=[];for(const item of parts)results.push(await lookupFood(item));mealFoods[meal]=mealFoods[meal].filter(x=>!x.legacy).concat(results);input.value='';renderDaySummary()}
async function saveDay(){
  if(!isConfigured){showFlash('Önce SCRIPT_URL ayarlanmalı.',true);return}
  try{await resolveMeal('breakfast');await resolveMeal('snack');await resolveMeal('dinner')}
  catch(e){showFlash(e.message==='quantity'?'Yiyecekleri miktarlarıyla yazın: 3 yumurta, 100 gram yulaf.':'Bir yiyeceğin besin bilgisi bulunamadı.',true);return}
  const f=currentForm();
  const payload={action:'save',person:personId,date:dateKey,breakfast:{desc:foodsToText(f.breakfast.foods),time:f.breakfast.time},snack:{desc:foodsToText(f.snack.foods),time:f.snack.time},dinner:{desc:foodsToText(f.dinner.foods),time:f.dinner.time},sport:f.sport};
  setBusy(true);
  try{
    // POST no-cors is opaque, but a completed fetch means the request was sent.
    await postToScript(payload);
    const old=allEntries.findIndex(r=>field(r,'kisi','person')===personId&&normalizeDateKey(field(r,'tarih','date'))===dateKey);
    const saved={kisi:personId,tarih:dateKey,kahvalti_ne:foodsToText(f.breakfast.foods),kahvalti_saat:f.breakfast.time,araogun_ne:foodsToText(f.snack.foods),araogun_saat:f.snack.time,aksam_ne:foodsToText(f.dinner.foods),aksam_saat:f.dinner.time,spor:f.sport};
    if(old>=0)allEntries[old]=saved;else allEntries.push(saved);
    showFlash('Kaydedildi ✓',false);
    renderDaySummary();
    renderHistory();

    // Refresh independently. A GET/CORS failure must not turn a successful save into an error.
    await new Promise(r=>setTimeout(r,700));
    try{allEntries=await fetchAllEntries();renderHistory();applyDayToForm()}
    catch(e){console.warn('Kayıt yenileme başarısız; ekrandaki kayıt korunuyor.',e)}
  }catch(e){
    console.error('Kayıt isteği başarısız:',e);
    showFlash('Kaydedilemedi, lütfen tekrar dene.',true)
  }finally{setBusy(false)}
}
async function deleteDay(dkey){setBusy(true);try{await postToScript({action:'delete',person:personId,date:dkey});allEntries=allEntries.filter(r=>!(field(r,'kisi','person')===personId&&normalizeDateKey(field(r,'tarih','date'))===dkey));confirmDeleteKey=null;renderHistory();if(dkey===dateKey)applyDayToForm()}catch(e){showFlash('Silinemedi, lütfen tekrar dene.',true)}finally{setBusy(false)}}
function renderHistory(){const p=PEOPLE[personId],list=$('history-list');const items=allEntries.filter(r=>field(r,'kisi','person')===personId).map(r=>({...r,_date:normalizeDateKey(field(r,'tarih','date'))})).filter(r=>validDateKey(r._date)).sort((a,b)=>b._date.localeCompare(a._date));if(!items.length){list.innerHTML='<div class="hist-empty">Henüz kayıt yok. İlk günü kaydedince burada listelenecek.</div>';return}list.innerHTML='';items.forEach(row=>{const f=rowToForm(row),parts=[];const names=k=>f[k].foods.map(x=>x.name).join(', ');if(names('breakfast'))parts.push(`Kahvaltı: ${names('breakfast')}`);if(names('snack'))parts.push(`Ara öğün: ${names('snack')}`);if(names('dinner'))parts.push(`Akşam: ${names('dinner')}`);if(f.sport)parts.push(`Spor: ${f.sport}`);const dkey=row._date,el=document.createElement('div');el.className='hist-item';const actions=confirmDeleteKey===dkey?`<div class="confirm-row"><span>Emin misin?</span><button class="icon-btn danger" data-action="confirm-yes" data-date="${dkey}">✓</button><button class="icon-btn" data-action="confirm-no">✕</button></div>`:`<button class="icon-btn" data-action="edit" data-date="${dkey}">✎</button><button class="icon-btn danger" data-action="delete" data-date="${dkey}">✕</button>`;el.innerHTML=`<div class="hist-date" style="background:${p.accent}">${formatTurkishShort(dkey)}</div><div class="hist-summary">${escapeHtml(parts.length?parts.join(' · '):'Boş kayıt')}</div><div class="hist-actions">${actions}</div>`;el.onclick=e=>{if(e.target.closest('.hist-actions'))return;dateKey=dkey;renderHeader();applyDayToForm()};list.appendChild(el)});list.querySelectorAll('[data-action="edit"]').forEach(b=>b.onclick=e=>{e.stopPropagation();dateKey=b.dataset.date;renderHeader();applyDayToForm()});list.querySelectorAll('[data-action="delete"]').forEach(b=>b.onclick=e=>{e.stopPropagation();confirmDeleteKey=b.dataset.date;renderHistory()});list.querySelectorAll('[data-action="confirm-yes"]').forEach(b=>b.onclick=e=>{e.stopPropagation();deleteDay(b.dataset.date)});list.querySelectorAll('[data-action="confirm-no"]').forEach(b=>b.onclick=e=>{e.stopPropagation();confirmDeleteKey=null;renderHistory()})}
function moveDay(amount){const d=new Date(`${dateKey}T00:00:00`);d.setDate(d.getDate()+amount);dateKey=toDateKey(d);renderHeader();applyDayToForm()}
['profile-sex','profile-age','profile-weight','profile-height'].forEach(id=>$(id).addEventListener('input',saveProfile));['breakfast-time','snack-time','dinner-time','sport-desc'].forEach(id=>$(id).addEventListener('input',renderDaySummary));$('prev-day').onclick=()=>moveDay(-1);$('next-day').onclick=()=>moveDay(1);$('save-btn').onclick=saveDay;renderHeader();applyDayToForm();if(isConfigured)refreshAll();
</script>
</body>
